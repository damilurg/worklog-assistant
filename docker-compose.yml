services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-worklogs}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-worklogs}']
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-worklogs}
      - GRAPH_HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DATABASE=${MONGODB_DATABASE:-worklog_graph}
      - GITLAB_INSTANCES=${GITLAB_INSTANCES}
      - GITLAB_AUTHOR_EMAILS=${GITLAB_AUTHOR_EMAILS}
      - GITLAB_AUTHOR_NAMES=${GITLAB_AUTHOR_NAMES}
      - JIRA_URL=${JIRA_URL}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_TOKEN=${JIRA_TOKEN}
      - JIRA_AUTH_MODE=${JIRA_AUTH_MODE:-cloud}
      - WORKDAY_HOURS=${WORKDAY_HOURS:-8}
      - TIMEZONE=${TIMEZONE:-Asia/Bishkek}
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  mongo_data:
  postgres_data:

