services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-worklogs}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-worklogs}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-worklogs}
      - GITLAB_URL=${GITLAB_URL}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - GITLAB_AUTHOR_EMAILS=${GITLAB_AUTHOR_EMAILS}
      - GITLAB_AUTHOR_NAMES=${GITLAB_AUTHOR_NAMES}
      - GITLAB_PROJECT_IDS=${GITLAB_PROJECT_IDS}
      - JIRA_URL=${JIRA_URL}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_TOKEN=${JIRA_TOKEN}
      - WORKDAY_HOURS=${WORKDAY_HOURS:-8}
      - TIMEZONE=${TIMEZONE:-Asia/Bishkek}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
